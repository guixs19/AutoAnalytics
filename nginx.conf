# nginx.conf - VERSÃO CORRIGIDA (sem flowise, com fallbacks)
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # Limite global para uploads (200KB)
    client_max_body_size 200k;
    
    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;
    
    # Otimizações
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Cache de arquivos estáticos
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/json
        application/xml+rss
        image/svg+xml;
    
    # Rate limiting (proteção contra brute force)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    
    # Mapeamento de tipos MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logs formatados
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    server {
        listen 80;
        server_name localhost;
        
        # Headers de segurança
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # ==============================================
        # ROTA PRINCIPAL
        # ==============================================
        location = / {
            root /usr/share/nginx/html;
            try_files /login.html /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # ==============================================
        # ROTAS ESPECÍFICAS (sem .html)
        # ==============================================
        location = /login {
            root /usr/share/nginx/html;
            try_files /login.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location = /dashboard {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location = /planos {
            root /usr/share/nginx/html;
            try_files /planos.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location = /checkout {
            root /usr/share/nginx/html;
            try_files /checkout.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # ==============================================
        # ARQUIVOS ESTÁTICOS (com cache)
        # ==============================================
        location ~* \.(css|js)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        
        # ==============================================
        # API - Proxy para o backend FastAPI
        # ==============================================
        location /api {
            client_max_body_size 200k;
            
            # Rate limiting específico para login
            location /api/auth/login {
                limit_req zone=login_limit burst=2 nodelay;
                proxy_pass http://api:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Rate limiting para outras APIs
            location /api/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://api:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Configurações comuns
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings (desabilitado para SSE)
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Headers adicionais
            proxy_set_header X-Request-ID $request_id;
            add_header X-Request-ID $request_id always;
            
            # Fallback se API falhar
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
        
        # ==============================================
        # HEALTH CHECK (público)
        # ==============================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header Cache-Control "no-cache";
        }
        
        # ==============================================
        # FALLBACK para rotas não encontradas
        # ==============================================
        location ~ ^/(?!api|health).*$ {
            set $html_path $uri;
            if ($uri ~ ^/([^./]+)$) {
                set $html_path /$1.html;
            }
            
            root /usr/share/nginx/html;
            try_files $uri $uri/ $html_path /login.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # ==============================================
        # NEGAR ACESSO A ARQUIVOS OCULTOS
        # ==============================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ==============================================
        # PROTEÇÃO CONTRA USER AGENTS MALICIOSOS
        # ==============================================
        if ($http_user_agent ~* (bot|crawler|scanner|nikto|sqlmap|wpscan|python-requests|curl|wget|zgrab|masscan)) {
            return 403;
        }
    }
}