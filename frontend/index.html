    <!-- ============================================== -->
    <!-- 🔥 SCRIPTS - ORDEM CORRETA (CRÍTICO) -->
    <!-- ============================================== -->
    
    <!-- ===== BIBLIOTECAS EXTERNAS ===== -->
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Toastr -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- XLSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- ============================================== -->
    <!-- 🔥🔥🔥 ORDEM DE CARREGAMENTO DOS SCRIPTS (CRÍTICO) 🔥🔥🔥 -->
    <!-- ============================================== -->
    
    <!-- 
        ⚠️⚠️⚠️ ATENÇÃO: ORDEM OBRIGATÓRIA ⚠️⚠️⚠️
        
        1. pow-client.js  → Define window.powClient (PoW)
        2. auth.js        → Define window.appAuth (Autenticação)
        3. app.js         → Define window.App (Orquestrador - v3.3 com Rate Limiter)
        4. dashboard.js   → Funcionalidades do dashboard
        5. payment.js     → Pagamentos e planos
        
        NUNCA inverta esta ordem!
        Se app.js carregar antes de auth.js, o sistema CRASHA com:
        "Cannot read properties of undefined (reading 'init')"
    -->
    
    <!-- 1️⃣ POW - PRIMEIRO (Proteção anti-bot) -->
    <script src="/js/pow-client.js?v=2.0"></script>
    
    <!-- 2️⃣ AUTH - SEGUNDO (Motor de autenticação) -->
    <script src="/js/auth.js"></script>
    
    <!-- 3️⃣ APP - TERCEIRO (Orquestrador - v3.3 com Rate Limiter) -->
    <script src="/js/app.js"></script>
    
    <!-- 4️⃣ DASHBOARD - QUARTO (Funcionalidades do dashboard) -->
    <script src="/js/dashboard.js"></script>
    
    <!-- 5️⃣ PAYMENT - QUINTO (Pagamentos e planos) -->
    <script src="/js/payment.js?v=2.0"></script>

    <!-- ============================================== -->
    <!-- 🔥 CONFIGURAÇÕES E INICIALIZAÇÃO -->
    <!-- ============================================== -->
    <script>
        // ==============================================
        // 🔥 TOASTR CONFIG
        // ==============================================
        toastr.options = {
            closeButton: true,
            progressBar: true,
            positionClass: "toast-top-right",
            timeOut: 5000,
            extendedTimeOut: 1000,
            escapeHtml: true
        };

        // ==============================================
        // 🔥 FUNÇÃO PARA ATUALIZAR STATUS DO POW
        // ==============================================
        function updatePowStatus() {
            try {
                const powStatusEl = document.getElementById('powStatus');
                const powTextEl = document.getElementById('powStatusText');
                
                if (!powStatusEl || !powTextEl) return;
                
                let stats = null;
                if (window.App && typeof window.App.getPowStats === 'function') {
                    stats = window.App.getPowStats();
                } else if (window.powClient && typeof window.powClient.getStats === 'function') {
                    stats = window.powClient.getStats();
                }
                
                if (stats && stats.available !== false) {
                    const solutionsReady = stats.solutionsReady || 0;
                    const maxStock = stats.maxStock || 2;
                    
                    if (solutionsReady > 0) {
                        powStatusEl.className = 'pow-status';
                        powTextEl.textContent = `${solutionsReady}/${maxStock} PoW`;
                        powStatusEl.title = `${solutionsReady} soluções PoW prontas para upload`;
                    } else if (stats.isSolving) {
                        powStatusEl.className = 'pow-status loading';
                        powTextEl.textContent = 'Calculando...';
                        powStatusEl.title = 'Calculando PoW em background';
                    } else {
                        powStatusEl.className = 'pow-status loading';
                        powTextEl.textContent = 'Preparando...';
                        powStatusEl.title = 'Preparando proteção anti-bot';
                    }
                } else {
                    powStatusEl.className = 'pow-status error';
                    powTextEl.textContent = 'Indisponível';
                    powStatusEl.title = 'PoW não disponível';
                }
            } catch (e) {
                console.warn('Erro ao atualizar status PoW:', e);
            }
        }

        // ==============================================
        // 🔥 FUNÇÃO PARA ATUALIZAR UI DO RATE LIMITER
        // ==============================================
        function updateRateLimitUI(detail) {
            // Verifica se há um indicador de rate limit na página
            const indicator = document.getElementById('rateLimitIndicator');
            const timer = document.getElementById('rateLimitTimer');
            const message = document.getElementById('rateLimitMessage');
            
            if (indicator) {
                indicator.classList.add('show');
            }
            
            if (timer) {
                const remaining = window.App ? window.App.getRateLimitTimeRemaining() : (detail?.retryAfter || 60);
                timer.textContent = remaining;
                
                // Atualiza a cada segundo
                if (window._rateLimitTimerInterval) {
                    clearInterval(window._rateLimitTimerInterval);
                }
                window._rateLimitTimerInterval = setInterval(function() {
                    if (window.App && window.App.isRateLimitBlocked()) {
                        const rem = window.App.getRateLimitTimeRemaining();
                        if (timer) timer.textContent = rem;
                        if (rem <= 0) {
                            clearInterval(window._rateLimitTimerInterval);
                            hideRateLimitUI();
                        }
                    } else {
                        clearInterval(window._rateLimitTimerInterval);
                        hideRateLimitUI();
                    }
                }, 1000);
            }
            
            if (message && detail?.message) {
                message.textContent = detail.message;
            }
            
            // Desabilita botão de upload se existir
            const uploadBtn = document.getElementById('uploadButton');
            if (uploadBtn) {
                uploadBtn.disabled = true;
                const remaining = window.App ? window.App.getRateLimitTimeRemaining() : (detail?.retryAfter || 60);
                uploadBtn.innerHTML = `<i class="fas fa-hourglass-half me-2"></i> Aguarde ${remaining}s`;
            }
        }

        function hideRateLimitUI() {
            const indicator = document.getElementById('rateLimitIndicator');
            const uploadBtn = document.getElementById('uploadButton');
            
            if (indicator) {
                indicator.classList.remove('show');
            }
            
            if (uploadBtn) {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = `<i class="fas fa-play-circle me-2"></i> Iniciar Análise <span class="badge ms-2" style="background: rgba(255,255,255,0.2); color: white;">1 crédito/arquivo</span>`;
            }
            
            if (window._rateLimitTimerInterval) {
                clearInterval(window._rateLimitTimerInterval);
                window._rateLimitTimerInterval = null;
            }
        }

        // ==============================================
        // 🔥 INICIALIZAÇÃO DO DASHBOARD
        // ==============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Inicializando Dashboard...');
            
            // AOS
            AOS.init({ once: true, duration: 800, offset: 50 });
            gsap.registerPlugin(ScrollTrigger);

            // Animação GSAP
            gsap.from('.upload-card', {
                scrollTrigger: {
                    trigger: '.upload-card',
                    start: 'top 90%',
                    toggleActions: 'play none none reverse'
                },
                duration: 0.8,
                y: 30,
                opacity: 0,
                stagger: 0.15,
                ease: 'power3.out'
            });

            // Verificação de token
            const token = localStorage.getItem('access_token');
            if (!token || token === '' || token === 'undefined' || token === 'null') {
                console.log('🔒 Fallback: Token não encontrado. Redirecionando...');
                window.location.href = '/login';
                return;
            }

            // ==============================================
            // 🔥 CONFIGURAÇÃO DO RATE LIMITER
            // ==============================================
            
            // Aguarda o App ficar pronto
            const checkApp = setInterval(function() {
                if (window.App && window.App.isRateLimitBlocked !== undefined) {
                    clearInterval(checkApp);
                    console.log('✅ App encontrado - ativando Rate Limiter');
                    
                    // Verifica se já está bloqueado
                    if (window.App.isRateLimitBlocked()) {
                        updateRateLimitUI();
                    }
                    
                    // Escuta eventos de rate limit
                    window.addEventListener('rateLimitBlocked', function(event) {
                        console.log('📢 Rate Limit bloqueado no dashboard', event.detail);
                        updateRateLimitUI(event.detail);
                    });
                    
                    window.addEventListener('rateLimitUnblocked', function() {
                        console.log('📢 Rate Limit desbloqueado no dashboard');
                        hideRateLimitUI();
                    });
                }
            }, 500);
            
            // Timeout de segurança
            setTimeout(function() {
                clearInterval(checkApp);
            }, 10000);

            // ==============================================
            // 🔥 EVENTO authReady (disparado pelo app.js)
            // ==============================================
            
            window.addEventListener('authReady', function(event) {
                console.log('📢 authReady recebido no dashboard', event.detail);
                
                if (event.detail && event.detail.isAuthenticated) {
                    // Carrega status premium
                    if (typeof window.loadPremiumStatus === 'function') {
                        window.loadPremiumStatus();
                    }
                    
                    // Inicia polling
                    if (typeof window.startPremiumStatusPolling === 'function') {
                        window.startPremiumStatusPolling(60000);
                    }
                    
                    // Atualiza PoW após 2 segundos
                    setTimeout(updatePowStatus, 2000);
                }
            });

            // ==============================================
            // 🔥 EVENTO creditsUpdated
            // ==============================================
            
            window.addEventListener('creditsUpdated', function(event) {
                const creditsDisplay = document.getElementById('creditsDisplay');
                if (creditsDisplay && event.detail && event.detail.display) {
                    creditsDisplay.textContent = event.detail.display;
                }
            });

            // ==============================================
            // 🔥 EVENTO powReady
            // ==============================================
            
            window.addEventListener('powReady', function() {
                setTimeout(updatePowStatus, 500);
            });

            // ==============================================
            // 🔥 ATUALIZAÇÃO PERIÓDICA DO POW
            // ==============================================
            
            setInterval(updatePowStatus, 10000);

            // ==============================================
            // 🔥 CARREGAR STATUS PREMIUM (FALLBACK)
            // ==============================================
            
            function loadPremiumStatusIfAvailable() {
                try {
                    if (typeof window.loadPremiumStatus === 'function') {
                        window.loadPremiumStatus();
                        return true;
                    }
                    if (window.app && typeof window.app.loadPremiumStatus === 'function') {
                        window.app.loadPremiumStatus();
                        return true;
                    }
                    if (window.autoAnalytics && typeof window.autoAnalytics.loadPremiumStatus === 'function') {
                        window.autoAnalytics.loadPremiumStatus();
                        return true;
                    }
                    return false;
                } catch (error) {
                    return false;
                }
            }

            function startPremiumPollingIfAvailable() {
                try {
                    if (typeof window.startPremiumStatusPolling === 'function') {
                        window.startPremiumStatusPolling(60000);
                        return true;
                    }
                    if (window.app && typeof window.app.startPremiumStatusPolling === 'function') {
                        window.app.startPremiumStatusPolling(60000);
                        return true;
                    }
                    if (window.autoAnalytics && typeof window.autoAnalytics.startPremiumStatusPolling === 'function') {
                        window.autoAnalytics.startPremiumStatusPolling(60000);
                        return true;
                    }
                    return false;
                } catch (error) {
                    return false;
                }
            }

            // Verifica se o app já está carregado
            function checkAppLoaded() {
                const authLoaded = window.appAuth !== undefined && window.appAuth !== null;
                const appLoaded = window.app !== undefined && window.app !== null;
                const autoAnalyticsLoaded = window.autoAnalytics !== undefined && window.autoAnalytics !== null;
                return authLoaded && (appLoaded || autoAnalyticsLoaded);
            }

            if (checkAppLoaded()) {
                loadPremiumStatusIfAvailable();
                startPremiumPollingIfAvailable();
                updatePowStatus();
            } else {
                let attempts = 0;
                const maxAttempts = 30;
                const waitForApp = setInterval(() => {
                    attempts++;
                    if (checkAppLoaded()) {
                        clearInterval(waitForApp);
                        loadPremiumStatusIfAvailable();
                        startPremiumPollingIfAvailable();
                        updatePowStatus();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(waitForApp);
                        console.error('❌ Timeout: App não carregou');
                    }
                }, 200);
            }

            console.log('✅ Dashboard carregado com sucesso!');
            console.log('⚡ PoW Status ativo - Proteção anti-bot');
            console.log('🔒 Rate Limiter integrado - Proteção contra abuso');
        });
    </script>
</body>
</html>
