<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAnalytics - Login</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .card {
            border-radius: 24px;
            overflow: hidden;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom: none;
            padding: 2rem 1.5rem;
        }
        
        .nav-tabs {
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
            gap: 0.5rem;
            padding: 0 0.5rem;
        }
        
        .nav-tabs .nav-link {
            color: #6c757d;
            font-weight: 600;
            border: none;
            padding: 0.85rem 1rem;
            transition: all 0.3s ease;
            border-radius: 12px 12px 0 0;
            position: relative;
            font-size: 0.95rem;
        }
        
        .nav-tabs .nav-link:hover {
            border: none;
            color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .nav-tabs .nav-link.active {
            color: #667eea;
            font-weight: 700;
            background: transparent;
        }
        
        .nav-tabs .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px 3px 0 0;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-success::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }
        
        .btn-success:hover::before {
            left: 100%;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-label i {
            color: #667eea;
        }
        
        /* 🔥 ESTILO DO CAPTCHA PRÓPRIO */
        .captcha-container {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
        }
        
        .captcha-container:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }
        
        .captcha-image-wrapper {
            background: white;
            border-radius: 12px;
            padding: 0.75rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            margin-bottom: 1rem;
        }
        
        .captcha-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            background: #f8f9fa;
        }
        
        .captcha-refresh {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .captcha-refresh:hover {
            background: #667eea;
            color: white;
            transform: rotate(180deg);
        }
        
        .captcha-refresh i {
            transition: transform 0.5s ease;
        }
        
        .captcha-refresh:hover i {
            transform: rotate(180deg);
        }
        
        .captcha-input {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .captcha-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .captcha-helper {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
        
        .captcha-helper i {
            color: #667eea;
            font-size: 0.9rem;
        }
        
        /* Timer do CAPTCHA */
        .captcha-timer {
            font-weight: 700;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .captcha-timer.expiring {
            color: #f56565;
            background: rgba(245, 101, 101, 0.1);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        
        .card-footer {
            background: #f8f9fa;
            border-top: 1px solid rgba(102, 126, 234, 0.1);
            padding: 1.25rem;
        }
        
        .text-muted a {
            color: #667eea;
            transition: color 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }
        
        .text-muted a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        /* Loading spinner */
        .btn .spinner-border {
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 0.5rem;
        }
        
        /* Animações */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .card {
                margin: 1rem;
            }
            
            .card-header {
                padding: 1.5rem 1rem;
            }
            
            .captcha-container {
                padding: 1rem;
            }
            
            .captcha-refresh {
                width: 42px;
                height: 42px;
            }
        }
        
        /* Badge de segurança */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        /* Token timer */

            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            color: white;
        }
        
        .alert {

        }
        
        .password-strength {

            border-radius: 2px;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .strength-weak {
            width: 33%;
            background: #f56565;
        }
        
        .strength-medium {
            width: 66%;
            background: #ecc94b;
        }
        
        .strength-strong {
            width: 100%;
            background: #48bb78;
        }
    </style>

    <script>
        // ===== SISTEMA DE CRONÔMETRO DO CAPTCHA (2 MINUTOS) =====
        class CaptchaTimer {
            constructor() {
                this.intervals = {};
                this.activeTimers = {};
            }
            
            // Iniciar timer para um CAPTCHA específico
            start(timerId, durationSeconds = 120) {
                // Parar timer anterior se existir
                if (this.intervals[timerId]) {
                    clearInterval(this.intervals[timerId]);
                }
                
                const timerElement = document.getElementById(timerId);
                if (!timerElement) return;
                
                let seconds = durationSeconds;
                
                // Atualizar imediatamente
                this.updateDisplay(timerElement, seconds);
                
                // Iniciar novo intervalo
                this.intervals[timerId] = setInterval(() => {
                    seconds--;
                    
                    if (seconds >= 0) {
                        this.updateDisplay(timerElement, seconds);
                        
                        // Quando faltar 30 segundos, mudar cor
                        if (seconds <= 30) {
                            timerElement.classList.add('expiring');
                        }
                    }
                    
                    if (seconds <= 0) {
                        // Timer expirou
                        clearInterval(this.intervals[timerId]);
                        timerElement.textContent = 'Expirado';
                        timerElement.classList.remove('expiring');
                        
                        // Disparar evento de expiração
                        const event = new CustomEvent('captchaExpired', { 
                            detail: { timerId: timerId }
                        });
                        document.dispatchEvent(event);
                    }
                }, 1000);
                
                this.activeTimers[timerId] = true;
            }
            
            // Parar timer
            stop(timerId) {
                if (this.intervals[timerId]) {
                    clearInterval(this.intervals[timerId]);
                    delete this.intervals[timerId];
                }
                this.activeTimers[timerId] = false;
            }
            
            // Atualizar display do timer
            updateDisplay(element, seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                element.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            // Verificar se timer está ativo
            isActive(timerId) {
                return this.activeTimers[timerId] || false;
            }
        }
        
        // Inicializar timers
        const captchaTimers = new CaptchaTimer();
        
        document.addEventListener('DOMContentLoaded', function() {
            
            // ===== FUNÇÕES DE UI/UX =====
            
            // Mostrar/ocultar senha
            const passwordFields = ['loginPassword', 'regPassword', 'regConfirmPassword'];
            passwordFields.forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    const wrapper = field.parentElement;
                    const toggleBtn = document.createElement('button');
                    toggleBtn.type = 'button';
                    toggleBtn.className = 'btn btn-link position-absolute end-0 top-50 translate-middle-y';
                    toggleBtn.style.textDecoration = 'none';
                    toggleBtn.style.zIndex = '10';
                    toggleBtn.innerHTML = '<i class="far fa-eye"></i>';
                    toggleBtn.onclick = function() {
                        const type = field.type === 'password' ? 'text' : 'password';
                        field.type = type;
                        this.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
                    };
                    
                    wrapper.style.position = 'relative';
                    wrapper.appendChild(toggleBtn);
                }
            });
            
            // ===== CAPTCHA TIMERS =====
            
            // Quando CAPTCHA for carregado (via auth.js)
            document.addEventListener('captchaLoaded', function(e) {
                if (e.detail && e.detail.type) {
                    if (e.detail.type === 'login') {
                        captchaTimers.start('loginCaptchaTimer', 120);
                    } else if (e.detail.type === 'register') {
                        captchaTimers.start('registerCaptchaTimer', 120);
                    }
                }
            });
            
            // Quando CAPTCHA expirar
            document.addEventListener('captchaExpired', function(e) {
                console.log('⏰ CAPTCHA expirado:', e.detail.timerId);
                
                // Se o CAPTCHA expirou, podemos mostrar mensagem
                if (e.detail.timerId === 'loginCaptchaTimer') {
                    const input = document.getElementById('loginCaptchaInput');
                    if (input) {
                        input.placeholder = 'CAPTCHA expirado. Atualize.';
                        input.disabled = true;
                    }
                } else if (e.detail.timerId === 'registerCaptchaTimer') {
                    const input = document.getElementById('registerCaptchaInput');
                    if (input) {
                        input.placeholder = 'CAPTCHA expirado. Atualize.';
                        input.disabled = true;
                    }
                }
            });
            
            // Forçar recarregamento do CAPTCHA quando trocar de aba
            document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
                tab.addEventListener('shown.bs.tab', function(e) {
                    if (e.target.id === 'login-tab' && window.appAuth) {
                        // Parar timer do registro
                        captchaTimers.stop('registerCaptchaTimer');
                        
                        // Carregar novo CAPTCHA de login
                        window.appAuth.loadLoginCaptcha();
                        
                    } else if (e.target.id === 'register-tab' && window.appAuth) {
                        // Parar timer do login
                        captchaTimers.stop('loginCaptchaTimer');
                        
                        // Carregar novo CAPTCHA de registro
                        window.appAuth.loadRegisterCaptcha();
                    }
                });
            });
            
            // Interceptar refresh dos CAPTCHAs
            document.getElementById('refreshLoginCaptcha')?.addEventListener('click', function() {
                captchaTimers.stop('loginCaptchaTimer');
                const timerEl = document.getElementById('loginCaptchaTimer');
                if (timerEl) {
                    timerEl.textContent = '--:--';
                    timerEl.classList.remove('expiring');
                }
            });
            
            document.getElementById('refreshRegisterCaptcha')?.addEventListener('click', function() {
                captchaTimers.stop('registerCaptchaTimer');
                const timerEl = document.getElementById('registerCaptchaTimer');
                if (timerEl) {
                    timerEl.textContent = '--:--';
                    timerEl.classList.remove('expiring');
                }
            });
            
            // ===== MEDIDOR DE FORÇA DA SENHA =====
            const passwordInput = document.getElementById('regPassword');
            const strengthIndicator = document.getElementById('passwordStrength');
            
            if (passwordInput && strengthIndicator) {
                passwordInput.addEventListener('input', function() {
                    const password = this.value;
                    let strength = 0;
                    
                    if (password.length >= 6) strength++;
                    if (password.match(/[a-z]+/)) strength++;
                    if (password.match(/[A-Z]+/)) strength++;
                    if (password.match(/[0-9]+/)) strength++;
                    if (password.match(/[$@#&!]+/)) strength++;
                    
                    strengthIndicator.className = 'password-strength';
                    
                    if (strength <= 2) {
                        strengthIndicator.classList.add('strength-weak');
                    } else if (strength <= 4) {
                        strengthIndicator.classList.add('strength-medium');
                    } else {
                        strengthIndicator.classList.add('strength-strong');
                    }
                });
            }
            
            // ===== VALIDAÇÃO DE SENHA NO REGISTRO =====
            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    const password = document.getElementById('regPassword').value;
                    const confirm = document.getElementById('regConfirmPassword').value;
                    
                    if (password !== confirm) {
                        e.preventDefault();
                        alert('As senhas não coincidem!');
                        return false;
                    }
                });
            }
            
            console.log('✅ UI do login carregada com cronômetros de CAPTCHA');
        });
    </script>
</body>
</html>
