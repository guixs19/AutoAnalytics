    <script>
        (function() {
            const token = localStorage.getItem('access_token');
            const isLogged = token !== null && token !== '';
            
            if (!isLogged) {
                console.log('🔒 Acesso não autorizado. Desviando para a tela de login...');
                window.location.replace('/login');
                throw new Error('Redirecionando para login');
            }
            
            console.log('✅ Sessão ativa. Carregando dashboard...');
        })();
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAnalytics - Dashboard de IA para Oficinas</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <!-- 🔥 JQUERY - OBRIGATÓRIO PARA TOASTR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <style>
        /* TODO O SEU CSS AQUI (mantido igual) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 🔥 NAVBAR ESTILO ORIGINAL */
        .navbar-modern {
            background: rgba(102, 126, 234, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .navbar-modern.scrolled {
            padding: 0.5rem 0;
            background: rgba(102, 126, 234, 0.98);
        }

        .brand-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .brand-text .gradient-text {
            color: #f5a623;
        }

        /* 🔥 CRÉDITS BADGE - APENAS ELE DOURADO */
        .credits-badge {
            background: linear-gradient(135deg, #f5a623 0%, #cd7f32 100%);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(205, 127, 50, 0.4);
            transition: transform 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .credits-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(205, 127, 50, 0.6);
        }

        /* Hero Section */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 120px 0 60px;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.9;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: white;
        }

        .hero-title .gradient-text {
            color: #f5a623;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        /* 🔥 UPLOAD CARD */
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.15);
        }

        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.15);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ===== TELA DE CARREGAMENTO ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spinner-brain {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f5a623;
            border-right: 4px solid #cd7f32;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #f5a623;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .loading-progress {
            width: 250px;
            margin-top: 20px;
        }

        .loading-progress .progress {
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }

        .loading-progress .progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Indicador de Processamento */
        .processing-indicator {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .processing-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1rem;
        }

        .processing-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .processing-text strong {
            color: #f5a623;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            color: white;
        }

        .btn-gradient:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline-danger {
            background: transparent;
            border: 1px solid #dc3545;
            color: #dc3545;
            transition: all 0.3s;
        }

        .btn-outline-danger:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-marker {
            position: absolute;
            left: -1.5rem;
            top: 0.25rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            border: 2px solid white;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .timeline-marker.bg-success {
            background: #48bb78;
            box-shadow: 0 0 0 2px rgba(72, 187, 120, 0.3);
        }

        .timeline-content {
            padding-left: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .timeline-content strong {
            color: #f5a623;
        }

        /* Métricas */
        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f5a623;
        }

        .metric-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .limit-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .limit-info i {
            color: #f5a623;
            margin-right: 0.5rem;
        }

        .limit-info .limit-value {
            font-weight: 700;
            color: #f5a623;
        }

        .size-warning {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #f8d7da;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .size-warning.show {
            display: block;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .admin-badge {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            margin-left: 0.5rem;
        }

        body.is-admin .admin-badge {
            display: inline-block;
        }

        /* Toastr */
        .toast-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%) !important;
        }
        .toast-error {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%) !important;
        }
        .toast-info {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%) !important;
        }
        .toast-warning {
            background: linear-gradient(135deg, #f5a623 0%, #cd7f32 100%) !important;
        }

        .gradient-text {
            color: #f5a623;
        }

        /* Análises em Andamento */
        .analysis-card {
            animation: slideInUp 0.3s ease-out;
            margin-bottom: 1rem;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .analysis-card .card {
            transition: all 0.2s;
            border-radius: 20px !important;
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white;
        }

        .analysis-card .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .analysis-card .metric-box {
            background: rgba(0, 0, 0, 0.2) !important;
            color: white;
        }
        .analysis-card .metric-label {
            color: rgba(255, 255, 255, 0.6);
        }
        .analysis-card .metric-value {
            color: #f5a623;
        }

        .file-preview-container {
            max-height: 200px;
            overflow-y: auto;
        }

        .file-preview-container .bg-light {
            background: rgba(0, 0, 0, 0.2) !important;
            color: white;
        }
        .file-preview-container .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        /* ===== ESTILOS GPSA ===== */
        .gpsa-dashboard { animation: fadeInUp 0.5s ease-out; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .impact-card, .trend-chart-card, .insights-card, .score-progress-card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            color: white;
        }
        
        .impact-card:hover, .trend-chart-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .impact-value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .trend-indicator { font-size: 0.8rem; padding: 4px 8px; background: rgba(0,0,0,0.2); border-radius: 20px; display: inline-block; }
        .insight-item { transition: all 0.2s; background: rgba(0,0,0,0.15) !important; color: white; }
        .insight-item:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.05) !important; }
        
        .gpsa-score-circle { position: relative; display: inline-block; }
        .score-ring { transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1.5s ease-out; }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .score-number { font-size: 2rem; font-weight: bold; display: block; line-height: 1; color: #f5a623; }
        
        .progress-bar { transition: width 3.5s ease-out; }

        .risk-summary {
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .risk-badge {
            transition: all 0.3s ease;
        }

        .risk-badge.high {
            background: rgba(245, 101, 101, 0.2);
            border: 1px solid rgba(245, 101, 101, 0.5);
        }
        .risk-badge.medium {
            background: rgba(245, 166, 35, 0.2);
            border: 1px solid rgba(245, 166, 35, 0.5);
        }
        .risk-badge.low {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.5);
        }
        .risk-badge:hover {
            transform: translateY(-2px);
        }
        .risk-value {
            font-size: 1.5rem;
            color: white;
        }
        .risk-label {
            font-size: 0.75rem;
            opacity: 0.8;
            color: rgba(255, 255, 255, 0.7);
        }
        .risk-badge .fw-bold {
            color: white;
        }

        /* Modais */
        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        .modal-content .modal-title {
            color: white !important;
        }
        .modal-content .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }
        .modal-content .alert-info {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: rgba(255, 255, 255, 0.8) !important;
        }
        .modal-content .alert-info strong {
            color: #f5a623 !important;
        }
        .modal-content .btn-close-white {
            filter: brightness(0) invert(1);
        }

        /* Footer */
        footer {
            background: rgba(102, 126, 234, 0.95) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        footer .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        footer .badge.bg-light {
            background: rgba(255, 255, 255, 0.15) !important;
            color: white !important;
        }

        /* ============================================== */
        /* 🔥 ESTILOS DO CARD PREMIUM */
        /* ============================================== */

        .premium-card {
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }

        .premium-card:hover {
            transform: translateY(-2px);
        }

        .premium-card.premium-active {
            background: linear-gradient(135deg, #2c1a0a 0%, #3d2614 100%);
            border-color: #cd7f32;
        }

        .premium-card.premium-inactive {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }

        .premium-status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .premium-badge {
            background: linear-gradient(135deg, #f5a623, #cd7f32);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 600;
        }

        .premium-badge.badge-warning {
            background: linear-gradient(135deg, #f5a623, #ed8936);
        }

        .premium-badge.badge-danger {
            background: linear-gradient(135deg, #f56565, #e53e3e);
        }

        .premium-progress {
            margin-bottom: 1rem;
        }

        .credit-status-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }

        .credit-status-card:hover {
            background: rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }

        .premium-message {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .premium-message-info {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: rgba(255,255,255,0.8);
        }

        .premium-message-success {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.3);
            color: #48bb78;
        }

        .premium-message-warning {
            background: rgba(245, 166, 35, 0.2);
            border: 1px solid rgba(245, 166, 35, 0.3);
            color: #f5a623;
        }

        .premium-message-warning strong {
            color: #f56565;
        }

        .btn-premium {
            background: linear-gradient(135deg, #f5a623, #cd7f32);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(205, 127, 50, 0.4);
            color: white;
        }

        .btn-premium-receive {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            animation: pulse-premium 2s ease-in-out infinite;
        }

        .btn-premium-receive:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.4);
            color: white;
        }

        @keyframes pulse-premium {
            0%, 100% { box-shadow: 0 0 0 0 rgba(72, 187, 120, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(72, 187, 120, 0.2); }
        }

        .premium-benefits-preview {
            margin: 1rem 0;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        .premium-expiring-warning {
            background: rgba(245, 166, 35, 0.15);
            border: 1px solid rgba(245, 166, 35, 0.3);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            color: #f5a623;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .premium-footer {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .premium-action-cta {
            padding: 0.5rem;
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
        }

        .premium-status-body {
            padding: 0.5rem 0;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .upload-card {
                padding: 1.5rem;
            }
            .impact-value { font-size: 1.8rem; }
            .score-number { font-size: 1.5rem; }
            .gpsa-score-circle svg { width: 100px; height: 100px; }
            .risk-value { font-size: 1.2rem; }
            .btn-gradient, .btn-outline-danger { font-size: 0.8rem; padding: 0.5rem 0.75rem; }
            
            .premium-status-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .premium-status-header .badge {
                align-self: flex-start;
            }
            .credit-status-card {
                padding: 0.75rem !important;
            }
            .credit-status-card div:first-child {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- TODO O CONTEÚDO DO INDEX.HTML AQUI (mantido igual) -->
    <!-- Navbar, Hero, Upload, etc. -->

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Configuração do Toastr -->
    <script>
        toastr.options = {
            closeButton: true,
            progressBar: true,
            positionClass: "toast-top-right",
            timeOut: 5000,
            extendedTimeOut: 1000,
            escapeHtml: true
        };
    </script>
    
    <!-- Scripts do sistema -->
    <script src="/static/js/auth.js?v=2.0"></script>
    <script src="/static/js/app.js?v=2.0"></script>
    <script src="/static/js/dashboard.js?v=2.0"></script>
    <script src="/static/js/payment.js?v=2.0"></script>
    
    <!-- Inicialização -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                console.log('🔒 Fallback: Token não encontrado. Redirecionando...');
                window.location.href = '/login';
                return;
            }
            
            AOS.init({ once: true, duration: 1000 });
            gsap.registerPlugin(ScrollTrigger);

            window.addEventListener('scroll', function() {
                const navbar = document.getElementById('mainNavbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            gsap.from('.hero-title', {
                duration: 1,
                y: 100,
                opacity: 0,
                ease: 'power3.out'
            });

            gsap.from('.upload-card', {
                scrollTrigger: {
                    trigger: '.upload-card',
                    start: 'top 80%',
                    toggleActions: 'play none none reverse'
                },
                duration: 1,
                x: 100,
                opacity: 0,
                ease: 'power3.out'
            });
            
            setTimeout(() => {
                if (window.loadPremiumStatus) {
                    window.loadPremiumStatus();
                    if (window.startPremiumStatusPolling) {
                        window.startPremiumStatusPolling(60000);
                    }
                }
                
                if (window.app) {
                    console.log('✅ App inicializado');
                } else {
                    console.error('❌ App não carregado');
                    toastr.error('Erro ao carregar a aplicação. Recarregue a página.');
                }
            }, 1500);
        });
    </script>
</body>
</html>
