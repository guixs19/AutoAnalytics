<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAnalytics - Login</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="/static/css/login.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .card {
            border-radius: 15px;
            overflow: hidden;
            border: none;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom: none;
        }
        
        .nav-tabs {
            border-bottom: 2px solid #e9ecef;
        }
        
        .nav-tabs .nav-link {
            color: #6c757d;
            font-weight: 500;
            border: none;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .nav-tabs .nav-link:hover {
            border: none;
            color: #667eea;
        }
        
        .nav-tabs .nav-link.active {
            color: #667eea;
            font-weight: 600;
            background: transparent;
            border-bottom: 3px solid #667eea;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            padding: 0.6rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        /* Estilo para o badge do reCAPTCHA */
        .grecaptcha-badge {
            box-shadow: 0 0 10px rgba(0,0,0,0.1) !important;
            border-radius: 8px !important;
        }
        
        .form-text a {
            color: #667eea;
            transition: color 0.3s ease;
        }
        
        .form-text a:hover {
            color: #764ba2;
        }
        
        .card-footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5 col-lg-4">
                <!-- Card de Login -->
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-gradient-primary text-white text-center py-4">
                        <i class="fas fa-car fa-3x mb-3"></i>
                        <h1 class="h4 mb-2">
                            <span class="fw-bold">Auto</span><span class="text-warning">Analytics</span>
                        </h1>
                        <p class="small mb-0 opacity-75">Sistema Inteligente para Oficinas</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Tabs Login/Registro -->
                        <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" 
                                        data-bs-target="#login" type="button" role="tab">
                                    <i class="fas fa-sign-in-alt me-1"></i> Entrar
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="tab" 
                                        data-bs-target="#register" type="button" role="tab">
                                    <i class="fas fa-user-plus me-1"></i> Registrar
                                </button>
                            </li>
                        </ul>
                        
                        <!-- Conteúdo das Tabs -->
                        <div class="tab-content">
                            <!-- TAB LOGIN -->
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label">
                                            <i class="fas fa-envelope me-1"></i> E-mail
                                        </label>
                                        <input type="email" class="form-control" id="loginEmail" 
                                               placeholder="seu@email.com" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label">
                                            <i class="fas fa-lock me-1"></i> Senha
                                        </label>
                                        <input type="password" class="form-control" id="loginPassword" 
                                               placeholder="Sua senha" required>
                                    </div>
                                    
                                    <div class="d-flex justify-content-end mb-3">
                                        <a href="#" class="small text-decoration-none">
                                            <i class="fas fa-question-circle me-1"></i>Esqueceu a senha?
                                        </a>
                                    </div>
                                    
                                    <!-- 🔥 CAPTCHA CUSTOMIZADO REMOVIDO -->
                                    <!-- O reCAPTCHA aparecerá automaticamente no canto inferior direito -->
                                    
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberMe">
                                        <label class="form-check-label small" for="rememberMe">
                                            <i class="far fa-check-circle me-1"></i>
                                            Manter conectado
                                        </label>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 py-2">
                                        <i class="fas fa-sign-in-alt me-2"></i>
                                        Entrar
                                    </button>
                                </form>
                            </div>
                            
                            <!-- TAB REGISTRO -->
                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label for="regName" class="form-label">
                                            <i class="fas fa-user me-1"></i> Nome Completo
                                        </label>
                                        <input type="text" class="form-control" id="regName" 
                                               placeholder="Seu nome completo" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="regEmail" class="form-label">
                                            <i class="fas fa-envelope me-1"></i> E-mail
                                        </label>
                                        <input type="email" class="form-control" id="regEmail" 
                                               placeholder="seu@email.com" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="regPassword" class="form-label">
                                            <i class="fas fa-lock me-1"></i> Senha
                                        </label>
                                        <input type="password" class="form-control" id="regPassword" 
                                               minlength="6" placeholder="Mínimo 6 caracteres" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="regConfirmPassword" class="form-label">
                                            <i class="fas fa-lock me-1"></i> Confirmar Senha
                                        </label>
                                        <input type="password" class="form-control" id="regConfirmPassword" 
                                               placeholder="Digite a senha novamente" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="regWorkshop" class="form-label">
                                            <i class="fas fa-wrench me-1"></i> Nome da Oficina
                                        </label>
                                        <input type="text" class="form-control" id="regWorkshop" 
                                               placeholder="Ex: Oficina Central" required>
                                    </div>
                                    
                                    <!-- 🔥 CAPTCHA CUSTOMIZADO REMOVIDO -->
                                    <!-- O reCAPTCHA aparecerá automaticamente no canto inferior direito -->
                                    
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="terms" required>
                                        <label class="form-check-label small" for="terms">
                                            <i class="far fa-check-circle me-1"></i>
                                            Aceito os <a href="#" class="text-decoration-none">Termos de Uso</a>
                                        </label>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-success w-100 py-2">
                                        <i class="fas fa-user-plus me-2"></i>
                                        Criar Conta
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <!-- Mensagens -->
                        <div id="authMessage" class="mt-3"></div>
                    </div>
                    
                    <div class="card-footer text-center py-3">
                        <small class="text-muted">
                            <i class="fas fa-shield-alt me-1"></i>
                            Este site é protegido por reCAPTCHA e Google 
                            <a href="https://policies.google.com/privacy" target="_blank" class="text-decoration-none">Política de Privacidade</a> e 
                            <a href="https://policies.google.com/terms" target="_blank" class="text-decoration-none">Termos de Serviço</a> se aplicam.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript de Autenticação -->
    <script src="/static/js/auth.js"></script>
</body>
</html>
